<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hospital Doctors | HospiCare</title><link rel="icon" href="assets/icon.png"><link rel="stylesheet" href="css/style.css"><style>
.hospital-detail-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}.back-link{color:#119b8e;text-decoration:none;font-weight:650}.hospital-detail-panel{background:linear-gradient(120deg,#e0f5ef,#f5fbf9);border:1px solid #d4e8e2;border-radius:18px;padding:22px;margin-bottom:24px}.doctor-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.doctor-results .doctor-profile-card{height:100%}.empty-state{padding:28px;border:1px dashed #cbded8;border-radius:16px;color:#6d7d79;background:#f8fbfa}.loading{color:#6d7d79;padding:20px}
</style></head><body><main class="main" style="max-width:1200px;margin:0 auto;padding:32px 24px"><div class="hospital-detail-head"><a class="back-link" href="hospitals.html">← Back to hospitals</a></div><section class="hospital-detail-panel"><span class="tag">Hospital details</span><h1 id="hospital-name">Hospital</h1><p class="lede">Doctors listed for this hospital. Select a doctor to view their profile or book an appointment.</p></section><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px"><h2>Doctors at this hospital</h2><a class="back-link" href="doctors.html">View all doctors →</a></div><section id="doctor-results" class="doctor-results"><p class="loading">Loading doctors…</p></section></main>
<script>
(function(){const params=new URLSearchParams(location.search);const hospital=params.get('hospital')||'';const nameEl=document.getElementById('hospital-name');const results=document.getElementById('doctor-results');nameEl.textContent=hospital||'Hospital not selected';if(!hospital){results.innerHTML='<div class="empty-state">No hospital was selected. <a href="hospitals.html">Return to hospitals</a>.</div>';return;}fetch('doctors.html').then(r=>{if(!r.ok)throw new Error('Could not load doctor directory');return r.text()}).then(markup=>{const doc=new DOMParser().parseFromString(markup,'text/html');const cards=[...doc.querySelectorAll('.doctor-profile-card')];const matches=cards.filter(card=>{const h=card.querySelector('.doctor-hospital');return h&&h.textContent.trim().toLowerCase()===hospital.trim().toLowerCase()});if(!matches.length){results.innerHTML='<div class="empty-state">No doctor profiles are currently listed for '+escapeHtml(hospital)+'. Please check the full <a href="doctors.html">doctor directory</a>.</div>';return;}results.innerHTML='';matches.forEach(card=>{const clone=document.importNode(card,true);results.appendChild(clone);});}).catch(()=>{results.innerHTML='<div class="empty-state">Unable to load doctor details right now. Please try again or visit the <a href="doctors.html">doctor directory</a>.</div>';});function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}})();
</script></body></html>
